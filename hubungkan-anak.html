<!DOCTYPE html>

<html lang="id">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Hubungkan Anak | RA Miftahul Hikmah</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

<style>

:root {
    --pink: #ef4f82;
    --blue: #31536c;
    --text: #647d89;
    --green: #299654;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #fff8fb,
            #f4fbff,
            #fffaf5
        );

    font-family:
        Arial,
        sans-serif;
}

.page {

    max-width: 600px;

    margin:
        60px auto;

    padding:
        20px;

}

.card {

    background:
        #ffffff;

    border-radius:
        28px;

    padding:
        35px;

    box-shadow:
        0 15px 40px
        rgba(
            50,
            100,
            130,
            .10
        );

}

.icon {

    width:
        80px;

    height:
        80px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    margin:
        0 auto 20px;

    border-radius:
        25px;

    background:
        linear-gradient(
            135deg,
            #ffe1ec,
            #fff0f6
        );

    font-size:
        40px;

}

h1 {

    margin:
        0;

    text-align:
        center;

    color:
        var(--blue);

    font-size:
        25px;

}

.subtitle {

    margin:
        12px 0 30px;

    text-align:
        center;

    color:
        #81949e;

    font-size:
        14px;

    line-height:
        1.7;

}

label {

    display:
        block;

    margin-bottom:
        10px;

    color:
        var(--blue);

    font-weight:
        bold;

    font-size:
        14px;

}

input {

    width:
        100%;

    box-sizing:
        border-box;

    padding:
        16px;

    border:
        1px solid
        #e6edf1;

    border-radius:
        15px;

    outline:
        none;

    font-size:
        15px;

    text-transform:
        uppercase;

}

input:focus {

    border-color:
        var(--pink);

    box-shadow:
        0 0 0 4px
        rgba(
            239,
            79,
            130,
            .08
        );

}

button {

    width:
        100%;

    margin-top:
        15px;

    padding:
        16px;

    border:
        none;

    border-radius:
        15px;

    cursor:
        pointer;

    font-size:
        14px;

    font-weight:
        bold;

    transition:
        .25s;

}

.search-btn {

    background:
        linear-gradient(
            135deg,
            #ef4f82,
            #ff7da5
        );

    color:
        white;

}

.search-btn:hover {

    transform:
        translateY(-3px);

}

.result {

    display:
        none;

    margin-top:
        25px;

    padding:
        25px;

    border-radius:
        20px;

    background:
        #f8fcff;

}

.result.show {

    display:
        block;

}

.result h2 {

    margin-top:
        0;

    color:
        var(--green);

    font-size:
        18px;

}

.child-info {

    margin-top:
        15px;

    padding:
        18px;

    border-radius:
        16px;

    background:
        white;

    line-height:
        2;

    color:
        var(--text);

}

.connect-btn {

    background:
        linear-gradient(
            135deg,
            #299654,
            #4ecb78
        );

    color:
        white;

}

.message {

    display:
        none;

    margin-top:
        15px;

    padding:
        15px;

    border-radius:
        14px;

    font-size:
        13px;

    line-height:
        1.6;

}

.message.show {

    display:
        block;

}

.message.error {

    background:
        #fff0f2;

    color:
        #d9435e;

}

.message.success {

    background:
        #e8fff0;

    color:
        #299654;

}

</style>

</head>

<body>

<div class="page">

<div class="card">

<div class="icon">
👨‍👩‍👧
</div>

<h1>
Hubungkan Anak
</h1>

<div class="subtitle">

Masukkan kode aktivasi yang
diberikan oleh sekolah untuk
menghubungkan akun Anda
dengan anak.

</div>

<label>
🔑 Kode Aktivasi Anak
</label>

<input
id="kodeInput"
type="text"
placeholder="Contoh: RMH123ABC"
>

<button
class="search-btn"
id="searchButton"
type="button"
>
🔍 Cari Anak
</button>

<div
class="message error"
id="errorMessage"
>
</div>

<div
class="message success"
id="successMessage"
>
</div>

<div
class="result"
id="resultBox"
>

<h2>
✅ Anak Ditemukan
</h2>

<div
class="child-info"
id="childInfo"
>
</div>

<button
class="connect-btn"
id="connectButton"
type="button"
>
🔗 Hubungkan Anak Saya
</button>

</div>

</div>

</div>


<!-- SUPABASE -->

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script>


/* =====================================
   SUPABASE CONFIG
===================================== */

const SUPABASE_URL =
"https://ervhwjrlqcsobawwhkpf.supabase.co";


const SUPABASE_KEY =
"sb_publishable_u48E-Q-RjdFRFLC_Cv3rmg_gD0Z3y2K";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================
   ELEMENT
===================================== */

const kodeInput =
document.getElementById(
    "kodeInput"
);


const searchButton =
document.getElementById(
    "searchButton"
);


const connectButton =
document.getElementById(
    "connectButton"
);


const resultBox =
document.getElementById(
    "resultBox"
);


const childInfo =
document.getElementById(
    "childInfo"
);


const errorMessage =
document.getElementById(
    "errorMessage"
);


const successMessage =
document.getElementById(
    "successMessage"
);


/* =====================================
   DATA
===================================== */

let currentUser =
null;


let selectedMurid =
null;


/* =====================================
   MESSAGE
===================================== */

function showError(
message
) {

    errorMessage.textContent =
    message;


    errorMessage.classList.add(
        "show"
    );


    successMessage.classList.remove(
        "show"
    );

}


function showSuccess(
message
) {

    successMessage.textContent =
    message;


    successMessage.classList.add(
        "show"
    );


    errorMessage.classList.remove(
        "show"
    );

}


function clearMessage() {

    errorMessage.classList.remove(
        "show"
    );


    successMessage.classList.remove(
        "show"
    );

}


/* =====================================
   CEK LOGIN
===================================== */

async function cekLogin() {

    try {

        const {
            data:
            {
                user
            },
            error
        } =
        await supabaseClient
        .auth
        .getUser();


        if (
            error ||
            !user
        ) {

            window.location.href =
            "login.html";

            return;

        }


        currentUser =
        user;


        console.log(
            "USER LOGIN:",
            user.id
        );


        const {
            data: profile,
            error: profileError
        } =
        await supabaseClient
        .from(
            "profiles"
        )
        .select(
            "id, full_name, role"
        )
        .eq(
            "id",
            user.id
        )
        .single();


        if (
            profileError
        ) {

            console.error(
                "PROFILE ERROR:",
                profileError
            );


            showError(
                "Profil akun tidak ditemukan: " +
                profileError.message
            );


            return;

        }


        if (
            !profile
        ) {

            showError(
                "Profil akun tidak ditemukan."
            );


            return;

        }


        /* =============================
           CEK ROLE

           DI DAFTAR.HTML ROLE YANG
           DIGUNAKAN ADALAH wali_murid
        ============================= */

        if (
            profile.role !==
            "wali_murid"
        ) {

            showError(
                "Halaman ini hanya untuk akun wali murid."
            );


            return;

        }


        console.log(
            "ROLE:",
            profile.role
        );


        console.log(
            "NAMA:",
            profile.full_name
        );


        showSuccess(
            "Halo " +
            (
                profile.full_name ||
                "Wali Murid"
            ) +
            "! Masukkan kode aktivasi anak."
        );


    }

    catch (
        error
    ) {

        console.error(
            "CEK LOGIN ERROR:",
            error
        );


        showError(
            "Terjadi kesalahan: " +
            error.message
        );

    }

}


/* =====================================
   CARI ANAK
===================================== */

searchButton.addEventListener(
"click",
async function() {


    clearMessage();


    resultBox.classList.remove(
        "show"
    );


    selectedMurid =
    null;


    const kode =
    kodeInput.value
    .trim()
    .toUpperCase();


    if (
        !kode
    ) {

        showError(
            "⚠️ Masukkan kode aktivasi anak terlebih dahulu."
        );


        return;

    }


    searchButton.disabled =
    true;


    searchButton.textContent =
    "⏳ Mencari...";


    try {


        console.log(
            "MENCARI KODE:",
            kode
        );


        const {
            data,
            error
        } =
        await supabaseClient
        .from(
            "murid"
        )
        .select(
            "id, nama, kelas, kode_aktivasi"
        )
        .eq(
            "kode_aktivasi",
            kode
        )
        .maybeSingle();


        if (
            error
        ) {

            console.error(
                "CARI ANAK ERROR:",
                error
            );


            throw error;

        }


        if (
            !data
        ) {

            showError(
                "❌ Kode aktivasi tidak ditemukan."
            );


            return;

        }


        selectedMurid =
        data;


        console.log(
            "ANAK DITEMUKAN:",
            data
        );


        childInfo.innerHTML =
        `
        👧 <strong>
        Nama Anak:
        </strong>

        ${data.nama || "-"}

        <br>

        🏫 <strong>
        Kelas:
        </strong>

        ${data.kelas || "-"}

        <br>

        🔑 <strong>
        Kode:
        </strong>

        ${data.kode_aktivasi}

        `;


        resultBox.classList.add(
            "show"
        );


        showSuccess(
            "✅ Anak berhasil ditemukan!"
        );


    }

    catch (
        error
    ) {

        console.error(
            "ERROR:",
            error
        );


        showError(
            "❌ Gagal mencari anak: " +
            error.message
        );

    }

    finally {

        searchButton.disabled =
        false;


        searchButton.textContent =
        "🔍 Cari Anak";

    }

}
);


/* =====================================
   HUBUNGKAN ANAK
===================================== */

connectButton.addEventListener(
"click",
async function() {


    clearMessage();


    if (
        !selectedMurid
    ) {

        showError(
            "⚠️ Silakan cari anak terlebih dahulu."
        );


        return;

    }


    if (
        !currentUser
    ) {

        showError(
            "⚠️ Anda belum login."
        );


        return;

    }


    connectButton.disabled =
    true;


    connectButton.textContent =
    "⏳ Menghubungkan...";


    try {


        console.log(
            "WALI ID:",
            currentUser.id
        );


        console.log(
            "MURID ID:",
            selectedMurid.id
        );


        /* =============================
           CEK APAKAH SUDAH TERHUBUNG
        ============================= */

        const {
            data: hubunganLama,
            error: cekError
        } =
        await supabaseClient
        .from(
            "wali_murid"
        )
        .select(
            "id"
        )
        .eq(
            "wali_id",
            currentUser.id
        )
        .eq(
            "murid_id",
            selectedMurid.id
        )
        .maybeSingle();


        if (
            cekError
        ) {

            console.error(
                "CEK HUBUNGAN ERROR:",
                cekError
            );

        }


        if (
            hubunganLama
        ) {

            showSuccess(
                "✅ Anak ini sudah terhubung dengan akun Anda."
            );


            connectButton.textContent =
            "✅ Sudah Terhubung";


            setTimeout(
                function() {

                    window.location.href =
                    "wali-murid.html";

                },
                1200
            );


            return;

        }


        /* =============================
           SIMPAN HUBUNGAN

           wali_id  = ID AKUN LOGIN
           murid_id = ID ANAK
        ============================= */

        const {
            data: hubunganBaru,
            error
        } =
        await supabaseClient
        .from(
            "wali_murid"
        )
        .insert(
            {

                wali_id:
                currentUser.id,

                murid_id:
                selectedMurid.id

            }
        )
        .select();


        if (
            error
        ) {

            console.error(
                "INSERT ERROR:",
                error
            );


            throw error;

        }


        console.log(
            "HUBUNGAN BERHASIL:",
            hubunganBaru
        );


        showSuccess(
            "🎉 Anak berhasil dihubungkan dengan akun Anda!"
        );


        connectButton.textContent =
        "✅ Berhasil Terhubung";


        /* =============================
           SIMPAN JUGA DI LOCAL STORAGE
        ============================= */

        localStorage.setItem(
            "muridId",
            selectedMurid.id
        );


        /* =============================
           PINDAH KE DASHBOARD
        ============================= */

        setTimeout(
            function() {

                window.location.href =
                "wali-murid.html";

            },
            1500
        );


    }

    catch (
        error
    ) {

        console.error(
            "HUBUNGKAN ERROR:",
            error
        );


        showError(
            "❌ Gagal menghubungkan anak: " +
            error.message
        );

    }

    finally {

        connectButton.disabled =
        false;

    }

}
);


/* =====================================
   INIT
===================================== */

cekLogin();


</script>

</body>

</html>
```
