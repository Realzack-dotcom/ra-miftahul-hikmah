<script

<script>


/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
    "https://ervhwjrlqcsobawwhkpf.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_u48E-Q-RjdFRFLC_Cv3rmg_gD0Z3y2K";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================
   ELEMENT
========================================= */

const anakList =
    document.getElementById(
        "anakList"
    );


const logoutButton =
    document.getElementById(
        "logoutButton"
    );


/* =========================================
   DATA
========================================= */

let currentUser =
    null;


let dataAnak =
    [];


let dataCatatan =
    [];


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text || "";


    return div.innerHTML;

}


/* =========================================
   FORMAT TANGGAL
========================================= */

function formatTanggal(
    tanggal
) {

    if (
        !tanggal
    ) {

        return "-";

    }


    const date =
        new Date(
            tanggal
        );


    return date.toLocaleString(
        "id-ID",
        {

            day:
                "numeric",

            month:
                "long",

            year:
                "numeric",

            hour:
                "2-digit",

            minute:
                "2-digit"

        }
    );

}


/* =========================================
   STATUS INFO
========================================= */

function getStatusInfo(
    status
) {

    const value =
        (
            status ||
            ""
        )
        .toLowerCase()
        .trim();


    if (
        value.includes(
            "baik"
        )
    ) {

        return {

            warna:
                "hijau",

            emoji:
                "🟢"

        };

    }


    if (
        value.includes(
            "bimbingan"
        )
    ) {

        return {

            warna:
                "kuning",

            emoji:
                "🟡"

        };

    }


    if (
        value.includes(
            "perhatian"
        )
    ) {

        return {

            warna:
                "merah",

            emoji:
                "🔴"

        };

    }


    return {

        warna:
            "kuning",

        emoji:
            "⚪"

    };

}


/* =========================================
   CEK LOGIN WALI
========================================= */

async function cekWali() {

    try {


        const {
            data: {
                user
            },
            error: userError
        } =
            await supabaseClient
            .auth
            .getUser();


        if (
            userError ||
            !user
        ) {

            window.location.href =
                "login.html";


            return false;

        }


        currentUser =
            user;


        const {
            data: profile,
            error: profileError
        } =
            await supabaseClient
            .from(
                "profiles"
            )
            .select(
                "full_name, role"
            )
            .eq(
                "id",
                user.id
            )
            .single();


        if (
            profileError ||
            !profile
        ) {

            throw new Error(
                "Profil wali murid tidak ditemukan."
            );

        }


        if (
            profile.role !==
            "wali_murid"
        ) {

            alert(
                "⛔ Halaman ini hanya untuk wali murid."
            );


            await supabaseClient
            .auth
            .signOut();


            window.location.href =
                "login.html";


            return false;

        }


        return true;


    }

    catch (
        error
    ) {

        console.error(
            "CEK WALI ERROR:",
            error
        );


        alert(
            "❌ " +
            error.message
        );


        return false;

    }

}


/* =========================================
   LOAD DATA ANAK
========================================= */

async function loadAnak() {

    try {


        const {
            data,
            error
        } =
            await supabaseClient
            .from(
                "murid"
            )
            .select(
                `
                id,
                nama,
                kelas,
                wali_id
                `
            )
            .eq(
                "wali_id",
                currentUser.id
            )
            .order(
                "nama",
                {
                    ascending:
                        true
                }
            );


        if (
            error
        ) {

            throw error;

        }


        dataAnak =
            data || [];


    }

    catch (
        error
    ) {

        console.error(
            "LOAD ANAK ERROR:",
            error
        );


        throw error;

    }

}


/* =========================================
   LOAD CATATAN
========================================= */

async function loadCatatan() {

    try {


        if (
            dataAnak.length ===
            0
        ) {

            dataCatatan =
                [];


            return;

        }


        const daftarIdAnak =
            dataAnak.map(
                function(
                    anak
                ) {

                    return anak.id;

                }
            );


        const {
            data,
            error
        } =
            await supabaseClient
            .from(
                "catatan_murid"
            )
            .select(
    `
    id,
    murid_id,
    guru_id,
    perkembangan,
    isi_catatan,
    created_at
    `
).in(
                "murid_id",
                daftarIdAnak
            )
            .order(
                "created_at",
                {
                    ascending:
                        false
                }
            );


        if (
            error
        ) {

            throw error;

        }


        dataCatatan =
            data || [];


    }

    catch (
        error
    ) {

        console.error(
            "LOAD CATATAN ERROR:",
            error
        );


        throw error;

    }

}


/* =========================================
   TAMPILKAN DATA
========================================= */

function tampilkanData() {


    anakList.innerHTML =
        "";


    if (
        dataAnak.length ===
        0
    ) {


        anakList.innerHTML =
            `

            <div class="empty-box">


                <div class="empty-icon">

                    👧

                </div>


                <h3>

                    Data Anak Belum Ditemukan

                </h3>


                <p>

                    Belum ada data murid
                    yang terhubung dengan
                    akun wali murid ini.

                    <br><br>

                    Silakan hubungi guru
                    untuk menghubungkan
                    akun Anda dengan
                    data anak.

                </p>


            </div>

            `;


        return;

    }


    dataAnak.forEach(
        function(
            anak
        ) {


            const catatanAnak =
                dataCatatan.filter(
                    function(
                        catatan
                    ) {

                        return (
                            catatan.murid_id ===
                            anak.id
                        );

                    }
                );


            const anakCard =
                document.createElement(
                    "div"
                );


            anakCard.className =
                "anak-card";


            let isiCatatan =
                "";


            if (
                catatanAnak.length ===
                0
            ) {


                isiCatatan =
                    `

                    <div class="no-catatan">

                        📝

                        <br><br>

                        Belum ada catatan
                        dari guru untuk
                        ${escapeHTML(
                            anak.nama
                        )}.

                    </div>

                    `;


            }

            else {


                catatanAnak.forEach(
                    function(
                        catatan
                    ) {


                        const info =
                            getStatusInfo(
                                catatan.perkembangan
                            );


                        isiCatatan +=
                            `

                            <div class="catatan-item">


                                <div class="catatan-top">


                                    <div>


                                        <div class="catatan-label">

                                            📚 Catatan Guru

                                        </div>


                                        <div
                                            class="
                                            status-badge
                                            status-${info.warna}
                                            "
                                        >

                                            ${info.emoji}

                                            ${escapeHTML(
                                                catatan.perkembangan ||
                                                "-"
                                            )}

                                        </div>


                                    </div>


                                    <div class="catatan-date">

                                        🕒 ${formatTanggal(
                                            catatan.created_at
                                        )}

                                    </div>


                                </div>


                                <div class="catatan-text">

                                    ${escapeHTML(
                                        catatan.isi_catatan ||
                                        "-"
                                    )}

                                </div>


                            </div>

                            `;

                    }
                );

            }


            anakCard.innerHTML =
                `

                <!-- HEADER ANAK -->

                <div class="anak-header">


                    <div class="anak-profile">


                        <div class="anak-avatar">

                            👧

                        </div>


                        <div>


                            <div class="anak-name">

                                ${escapeHTML(
                                    anak.nama
                                )}

                            </div>


                            <div class="anak-kelas">

                                👥 ${
                                    escapeHTML(
                                        anak.kelas ||
                                        "-"
                                    )
                                }

                            </div>


                        </div>


                    </div>


                    <div class="catatan-count">

                        📝 ${
                            catatanAnak.length
                        } Catatan

                    </div>


                </div>


                <!-- CATATAN -->

                <div class="catatan-container">

                    ${isiCatatan}

                </div>

                `;


            anakList.appendChild(
                anakCard
            );


        }
    );

}


/* =========================================
   LOAD SEMUA DATA
========================================= */

async function loadSemuaData() {

    try {


        anakList.innerHTML =
            `

            <div class="loading">

                ⏳ Memuat data anak
                dan catatan...

            </div>

            `;


        await loadAnak();


        await loadCatatan();


        tampilkanData();


    }

    catch (
        error
    ) {

        console.error(
            "LOAD SEMUA DATA ERROR:",
            error
        );


        anakList.innerHTML =
            `

            <div class="empty-box">


                <div class="empty-icon">

                    ⚠️

                </div>


                <h3>

                    Data Tidak Dapat Dimuat

                </h3>


                <p>

                    ${escapeHTML(
                        error.message
                    )}

                </p>


            </div>

            `;

    }

}
